name: TfL Realtime Tracker Daemon

on:
  schedule:
    # EVERY 15 MINUTES, EXCEPT 2-4AM (MAINTENANCE WINDOW)
    - cron: "*/15 0-1,5-23 * * *"
  workflow_dispatch: # ALLOW MANUAL TRIGGERING OF THE WORKFLOW

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # ALLOW THE BOT TO PUSH CHANGES BACK TO THE REPOSITORY

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/checkout@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Fetch Script
        run: python TfL-Realtime-Track/fetch_status.py

      - name: Commit and Push if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TfL-Realtime-Track/status.json
          git diff-index --quiet HEAD || (git commit -m "🤖 Automatically updated TfL live status" && git push)
