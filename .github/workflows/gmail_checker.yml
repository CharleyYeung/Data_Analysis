name: Hourly Job Application Tracker

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  check-gmail:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./jobapp-tracker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.JOBAPP_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.JOBAPP_AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Run Gmail Checker
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
          AWS_S3_BUCKET: ${{ secrets.JOBAPP_AWS_S3_BUCKET }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          python -c 'import os; open("token.json", "w").write(os.environ["GMAIL_TOKEN_JSON"])'
          python main.py

      - name: Update token and tracker in repo
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: Auto-update job alerts and Gmail token"
          file_pattern: "job_alert.csv token.json"
