name: Check Gmail for Job Updates

on:
  schedule:
    # Runs at the start of every hour
    - cron: "0 * * * *"
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

jobs:
  check-gmail:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Gmail Checker
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
        run: |
          echo "$GMAIL_TOKEN_JSON" > token.json
          python quickstart.py

      - name: Update token
        if: always() # Always run this step to save the refreshed token
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: Update Gmail token"
          file_pattern: token.json
